name: Build OpenWrt for Xiaomi 4A 100M (Breed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout OpenWrt v23.05.5
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt

      - name: Patch device tree to Breed layout
        run: python3 patch_dts.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libncursesw5-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget

      - name: Configure image
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4a-100m=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          EOF
          make defconfig

      - name: Download source tarballs
        run: |
          cd openwrt
          make -j8 download V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xiaomi-4a-100m-breed
          path: openwrt/bin/targets/ramips/mt76x8/*.bin
          if-no-files-found: error
